<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🛒 Kids Supermarkt Kassa</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:linear-gradient(135deg,#ffecd2,#fcb69f);
  min-height:100vh;
  overflow-x:hidden;
}

.app{
  max-width:1200px;
  margin:auto;
  padding:10px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  padding:14px 20px;
  border-radius:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.header h1{
  font-size:1.4rem;
}

.clear-btn{
  background:#ff4d6d;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
}

/* MAIN */
.main{
  display:flex;
  gap:10px;
}

/* PRODUCTS */
.products-section{
  flex:1.5;
}

.categories{
  display:flex;
  gap:8px;
  margin-bottom:10px;
  overflow-x:auto;
}

.category-btn{
  border:none;
  color:white;
  padding:10px 16px;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
  white-space:nowrap;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:10px;
  align-content:start;
}

.product{
  background:white;
  border-radius:18px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  transition:.15s;
  height:110px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.product:active{
  transform:scale(.95);
}

.product .emoji{
  font-size:2rem;
}

.product .name{
  font-size:.8rem;
  font-weight:600;
}

.product .price{
  color:#667eea;
  font-weight:bold;
  font-size:.8rem;
}

/* CART */
.cart{
  flex:1;
  background:white;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.1);
  min-height:500px;
}

.cart-header{
  padding:14px;
  border-bottom:2px dashed #eee;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  color:#764ba2;
}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.empty{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:#bbb;
}

.empty .emoji{
  font-size:3rem;
  margin-bottom:10px;
}

.cart-item{
  background:#f8f9ff;
  padding:10px;
  border-radius:12px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.left{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty{
  background:#667eea;
  color:white;
  width:22px;
  height:22px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.75rem;
}

.remove{
  border:none;
  background:#ff6b6b;
  color:white;
  width:24px;
  height:24px;
  border-radius:50%;
  cursor:pointer;
}

.total{
  padding:14px;
  border-top:2px dashed #eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.total-price{
  font-size:1.6rem;
  font-weight:bold;
  color:#764ba2;
}

.checkout{
  margin:0 12px 12px;
  border:none;
  background:linear-gradient(135deg,#11998e,#38ef7d);
  color:white;
  padding:16px;
  border-radius:16px;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.checkout:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* MOBILE */
@media(max-width:800px){

  .main{
    flex-direction:column;
  }

  .cart{
    min-height:350px;
  }

  .products-grid{
    grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  }

  .product{
    height:95px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <h1>🛒 Kids Supermarkt Kassa</h1>
    <button class="clear-btn" onclick="clearCart()">🗑️ Wis</button>
  </div>

  <div class="main">

    <!-- PRODUCTS -->
    <div class="products-section">

      <div class="categories" id="categories"></div>

      <div class="products-grid" id="productsGrid"></div>

    </div>

    <!-- CART -->
    <div class="cart">

      <div class="cart-header">
        <span>🧾 Winkelwagentje</span>
        <span id="count">0 items</span>
      </div>

      <div class="cart-items" id="cartItems">

        <div class="empty">
          <div class="emoji">🛒</div>
          <div>Scan producten!</div>
        </div>

      </div>

      <div class="total">
        <span>Totaal:</span>
        <span class="total-price" id="total">€0,00</span>
      </div>

      <button class="checkout" id="checkoutBtn" onclick="checkout()" disabled>
        💰 Afrekenen
      </button>

    </div>

  </div>

</div>

<script>

/* CATEGORIES */
const categories = [

  {id:'fruit',name:'🍎 Fruit',color:'#ff6b6b'},
  {id:'groente',name:'🥦 Groente',color:'#38ef7d'},
  {id:'drank',name:'🥤 Drank',color:'#667eea'},
  {id:'zuivel',name:'🧀 Zuivel',color:'#ffd700'},
  {id:'snacks',name:'🍩 Snacks',color:'#ff9ff3'},
  {id:'bakery',name:'🥐 Bakkerij',color:'#f39c12'}

];

/* PRODUCTS */
const products = [

  /* FRUIT */
  {id:1,name:'Appel',emoji:'🍎',price:0.79,cat:'fruit'},
  {id:2,name:'Banaan',emoji:'🍌',price:0.69,cat:'fruit'},
  {id:3,name:'Aardbei',emoji:'🍓',price:1.49,cat:'fruit'},
  {id:4,name:'Watermeloen',emoji:'🍉',price:3.99,cat:'fruit'},
  {id:5,name:'Druiven',emoji:'🍇',price:2.49,cat:'fruit'},
  {id:6,name:'Ananas',emoji:'🍍',price:2.99,cat:'fruit'},

  /* GROENTE */
  {id:7,name:'Broccoli',emoji:'🥦',price:1.29,cat:'groente'},
  {id:8,name:'Tomaat',emoji:'🍅',price:0.89,cat:'groente'},
  {id:9,name:'Wortel',emoji:'🥕',price:0.99,cat:'groente'},
  {id:10,name:'Maïs',emoji:'🌽',price:1.19,cat:'groente'},
  {id:11,name:'Paprika',emoji:'🫑',price:1.49,cat:'groente'},

  /* DRINKS */
  {id:12,name:'Water',emoji:'💧',price:0.49,cat:'drank'},
  {id:13,name:'Cola',emoji:'🥤',price:1.29,cat:'drank'},
  {id:14,name:'Sap',emoji:'🧃',price:1.49,cat:'drank'},
  {id:15,name:'Koffie',emoji:'☕',price:2.49,cat:'drank'},
  {id:16,name:'Thee',emoji:'🍵',price:1.19,cat:'drank'},

  /* ZUIVEL */
  {id:17,name:'Melk',emoji:'🥛',price:1.09,cat:'zuivel'},
  {id:18,name:'Kaas',emoji:'🧀',price:2.49,cat:'zuivel'},
  {id:19,name:'Yoghurt',emoji:'🍶',price:1.59,cat:'zuivel'},
  {id:20,name:'Boter',emoji:'🧈',price:1.89,cat:'zuivel'},
  {id:21,name:'Ijs',emoji:'🍦',price:2.99,cat:'zuivel'},

  /* SNACKS */
  {id:22,name:'Donut',emoji:'🍩',price:1.29,cat:'snacks'},
  {id:23,name:'Cookie',emoji:'🍪',price:0.89,cat:'snacks'},
  {id:24,name:'Lolly',emoji:'🍭',price:0.59,cat:'snacks'},
  {id:25,name:'Chips',emoji:'🍟',price:1.99,cat:'snacks'},
  {id:26,name:'Chocolade',emoji:'🍫',price:1.49,cat:'snacks'},

  /* BAKERY */
  {id:27,name:'Croissant',emoji:'🥐',price:1.19,cat:'bakery'},
  {id:28,name:'Brood',emoji:'🍞',price:1.99,cat:'bakery'},
  {id:29,name:'Bagel',emoji:'🥯',price:1.49,cat:'bakery'},
  {id:30,name:'Pannenkoek',emoji:'🥞',price:2.49,cat:'bakery'}

];

let currentCategory='fruit';
let cart=[];
let total=0;

/* RENDER CATEGORIES */
function renderCategories(){

  const categoriesDiv=document.getElementById('categories');

  categoriesDiv.innerHTML=categories.map(cat=>`

    <button
      class="category-btn"
      style="background:${cat.color}"
      onclick="selectCategory('${cat.id}')">

      ${cat.name}

    </button>

  `).join('');
}

/* SELECT CATEGORY */
function selectCategory(id){

  currentCategory=id;

  renderProducts();
}

/* RENDER PRODUCTS */
function renderProducts(){

  const grid=document.getElementById('productsGrid');

  const filtered=products.filter(p=>p.cat===currentCategory);

  grid.innerHTML=filtered.map(product=>`

    <div class="product" onclick="addToCart(${product.id})">

      <div class="emoji">${product.emoji}</div>

      <div class="name">${product.name}</div>

      <div class="price">
        €${product.price.toFixed(2)}
      </div>

    </div>

  `).join('');
}

/* ADD TO CART */
function addToCart(id){

  const product=products.find(p=>p.id===id);

  const existing=cart.find(item=>item.id===id);

  if(existing){

    existing.qty++;

  }else{

    cart.push({...product,qty:1});

  }

  updateCart();
}

/* UPDATE CART */
function updateCart(){

  const cartItems=document.getElementById('cartItems');

  const totalDiv=document.getElementById('total');

  const count=document.getElementById('count');

  const btn=document.getElementById('checkoutBtn');

  total=0;

  let qtyTotal=0;

  if(cart.length===0){

    cartItems.innerHTML=`

      <div class="empty">
        <div class="emoji">🛒</div>
        <div>Scan producten!</div>
      </div>

    `;

    totalDiv.textContent='€0,00';

    count.textContent='0 items';

    btn.disabled=true;

    return;
  }

  btn.disabled=false;

  cartItems.innerHTML=cart.map((item,index)=>{

    total += item.price * item.qty;

    qtyTotal += item.qty;

    return `

      <div class="cart-item">

        <div class="left">

          <div>${item.emoji}</div>

          <div>${item.name}</div>

          <div class="qty">${item.qty}</div>

        </div>

        <div style="display:flex;align-items:center;gap:8px">

          <div>€${(item.price*item.qty).toFixed(2)}</div>

          <button class="remove" onclick="removeItem(${index})">
            ✕
          </button>

        </div>

      </div>

    `;

  }).join('');

  totalDiv.textContent=`€${total.toFixed(2)}`;

  count.textContent=`${qtyTotal} items`;
}

/* REMOVE ITEM */
function removeItem(index){

  cart.splice(index,1);

  updateCart();
}

/* CLEAR */
function clearCart(){

  cart=[];

  updateCart();
}

/* CHECKOUT */
function checkout(){

  if(cart.length===0){
    alert("Winkelwagen is leeg 🛒");
    return;
  }

  let receipt="🧾 BONNETJE\n\n";

  cart.forEach(item=>{

    receipt += `${item.emoji} ${item.name} x${item.qty} - €${(item.price*item.qty).toFixed(2)}\n`;

  });

  receipt += `\n💰 Totaal: €${total.toFixed(2)}`;

  alert(receipt);

  cart=[];

  updateCart();
}

/* INIT */
renderCategories();
renderProducts();
updateCart();

</script>

</body>
</html>
