<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🛒 Kids Supermarkt Kassa</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

body{
  font-family:'Segoe UI','Comic Sans MS',cursive,sans-serif;
  background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 100%);
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
}

/* APP */
.app-container{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  max-width:900px;
  margin:0 auto;
  padding:8px;
  gap:8px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  border-radius:20px;
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 15px rgba(102,126,234,.4);
}

.header h1{
  color:white;
  font-size:1.5em;
}

.clear-btn{
  background:#ff4757;
  color:white;
  border:none;
  padding:8px 16px;
  border-radius:12px;
  font-size:.9em;
  font-weight:bold;
  cursor:pointer;
}

/* MAIN */
.main-area{
  display:flex;
  gap:8px;
  flex:1;
  min-height:0;
}

/* PRODUCTS */
.products-panel{
  flex:1.4;
  display:flex;
  flex-direction:column;
  gap:6px;
  min-height:0;
}

.category-tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding-bottom:4px;
}

.cat-tab{
  padding:8px 14px;
  border-radius:14px;
  border:none;
  font-size:.85em;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
  color:white;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:6px;
  overflow-y:auto;
  flex:1;
  padding:4px;
}

.product-btn{
  background:white;
  border-radius:16px;
  padding:8px 4px;
  border:none;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  min-height:85px;
}

.product-btn .emoji{
  font-size:2em;
}

.product-btn .name{
  font-size:.65em;
  font-weight:bold;
  text-align:center;
}

.product-btn .price{
  font-size:.7em;
  color:#667eea;
  font-weight:bold;
}

/* CART */
.cart-panel{
  flex:1;
  background:white;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  box-shadow:0 4px 20px rgba(0,0,0,.1);
  min-height:0;
}

.cart-header{
  padding:10px 14px;
  font-weight:bold;
  font-size:1.1em;
  color:#764ba2;
  border-bottom:2px dashed #eee;
  display:flex;
  justify-content:space-between;
}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:6px 10px;
}

.cart-empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100%;
  color:#ccc;
}

.big-emoji{
  font-size:3em;
  margin-bottom:8px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 8px;
  border-radius:10px;
  margin-bottom:4px;
  background:#f8f9ff;
}

.ci-left{
  display:flex;
  align-items:center;
  gap:6px;
}

.ci-emoji{
  font-size:1.3em;
}

.ci-name{
  font-size:.8em;
  font-weight:600;
}

.ci-qty{
  background:#667eea;
  color:white;
  border-radius:50%;
  width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7em;
}

.ci-price{
  font-weight:bold;
  color:#764ba2;
  font-size:.85em;
}

.ci-remove{
  background:#ff6b6b;
  color:white;
  border:none;
  border-radius:50%;
  width:22px;
  height:22px;
  cursor:pointer;
}

.cart-total{
  padding:12px 14px;
  border-top:2px dashed #eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.total-amount{
  font-size:1.6em;
  font-weight:bold;
  color:#764ba2;
}

.pay-btn{
  margin:0 10px 10px;
  padding:14px;
  background:linear-gradient(135deg,#11998e,#38ef7d);
  color:white;
  border:none;
  border-radius:16px;
  font-size:1.2em;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 15px rgba(17,153,142,.4);
}

.pay-btn:disabled{
  opacity:.4;
}

/* MOBILE FIX */
@media (max-width:600px){

  .main-area{
    flex-direction:column;
    overflow-y:auto;
  }

  .products-grid{
    grid-template-columns:repeat(auto-fill,minmax(75px,1fr));
  }

  .product-btn{
    min-height:75px;
  }

  .product-btn .emoji{
    font-size:1.6em;
  }

  .header h1{
    font-size:1.1em;
  }

  .cart-panel{
    min-height:260px;
    max-height:none;
  }

  .pay-btn{
    position:sticky;
    bottom:10px;
    z-index:20;
  }
}

/* SCROLLBAR */
::-webkit-scrollbar{
  width:6px;
}

::-webkit-scrollbar-thumb{
  background:#ccc;
  border-radius:3px;
}
</style>
</head>

<body>

<div class="app-container">

  <div class="header">
    <span>🛒</span>
    <h1>Kids Supermarkt Kassa</h1>
    <button class="clear-btn" onclick="clearCart()">🗑️ Wis</button>
  </div>

  <div class="main-area">

    <div class="products-panel">
      <div class="category-tabs" id="categoryTabs"></div>
      <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="cart-panel">

      <div class="cart-header">
        <span>🧾 Winkelwagentje</span>
        <span id="cartCount">0 items</span>
      </div>

      <div class="cart-items" id="cartItems">
        <div class="cart-empty">
          <div class="big-emoji">🛒</div>
          <div>Scan producten!</div>
        </div>
      </div>

      <div class="cart-total">
        <span>Totaal:</span>
        <span class="total-amount" id="totalAmount">€0,00</span>
      </div>

      <button class="pay-btn" id="payBtn" disabled>
        💰 Afrekenen
      </button>

    </div>

  </div>

</div>

<script>
const categories = [
  {id:'fruit',name:'🍎 Fruit',color:'#ff6b6b'},
  {id:'groente',name:'🥦 Groente',color:'#38ef7d'},
  {id:'zuivel',name:'🧀 Zuivel',color:'#ffd700'},
  {id:'drank',name:'🥤 Drank',color:'#667eea'}
];

const products = [
  {id:1,name:'Appel',emoji:'🍎',price:0.79,cat:'fruit'},
  {id:2,name:'Banaan',emoji:'🍌',price:0.69,cat:'fruit'},
  {id:3,name:'Broccoli',emoji:'🥦',price:1.29,cat:'groente'},
  {id:4,name:'Tomaat',emoji:'🍅',price:0.89,cat:'groente'},
  {id:5,name:'Melk',emoji:'🥛',price:1.09,cat:'zuivel'},
  {id:6,name:'Kaas',emoji:'🧀',price:2.49,cat:'zuivel'},
  {id:7,name:'Water',emoji:'💧',price:0.49,cat:'drank'},
  {id:8,name:'Cola',emoji:'🥤',price:1.29,cat:'drank'}
];

let currentCategory='fruit';
let cart=[];
let total=0;

function renderCategories(){
  const tabs=document.getElementById('categoryTabs');

  tabs.innerHTML=categories.map(c=>`
    <button class="cat-tab"
      style="background:${c.color}"
      onclick="selectCategory('${c.id}')">
      ${c.name}
    </button>
  `).join('');
}

function selectCategory(cat){
  currentCategory=cat;
  renderProducts();
}

function renderProducts(){
  const grid=document.getElementById('productsGrid');

  const filtered=products.filter(p=>p.cat===currentCategory);

  grid.innerHTML=filtered.map(p=>`
    <button class="product-btn" onclick="addToCart(${p.id})">
      <span class="emoji">${p.emoji}</span>
      <span class="name">${p.name}</span>
      <span class="price">€${p.price.toFixed(2)}</span>
    </button>
  `).join('');
}

function addToCart(id){
  const product=products.find(p=>p.id===id);

  const existing=cart.find(c=>c.id===id);

  if(existing){
    existing.qty++;
  }else{
    cart.push({...product,qty:1});
  }

  recalc();
  renderCart();
}

function removeItem(index){
  cart.splice(index,1);
  recalc();
  renderCart();
}

function clearCart(){
  cart=[];
  recalc();
  renderCart();
}

function recalc(){
  total=cart.reduce((s,c)=>s+(c.price*c.qty),0);
}

function renderCart(){

  const items=document.getElementById('cartItems');
  const count=document.getElementById('cartCount');
  const totalEl=document.getElementById('totalAmount');
  const payBtn=document.getElementById('payBtn');

  if(cart.length===0){
    items.innerHTML=`
      <div class="cart-empty">
        <div class="big-emoji">🛒</div>
        <div>Scan producten!</div>
      </div>
    `;
    count.textContent='0 items';
    totalEl.textContent='€0,00';
    payBtn.disabled=true;
    return;
  }

  const totalItems=cart.reduce((s,c)=>s+c.qty,0);

  count.textContent=`${totalItems} items`;
  totalEl.textContent=`€${total.toFixed(2).replace('.',',')}`;
  payBtn.disabled=false;

  items.innerHTML=cart.map((c,i)=>`
    <div class="cart-item">
      <div class="ci-left">
        <span class="ci-emoji">${c.emoji}</span>
        <span class="ci-name">${c.name}</span>
        <span class="ci-qty">${c.qty}</span>
      </div>

      <span class="ci-price">
        €${(c.price*c.qty).toFixed(2)}
      </span>

      <button class="ci-remove" onclick="removeItem(${i})">
        ✕
      </button>
    </div>
  `).join('');
}

renderCategories();
renderProducts();
renderCart();
</script>

</body>
</html>
